name: Deploy Portfolio Projects to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build Project 01 — Coffee Shop
        working-directory: ./coffee-shop
        run: |
          npm ci
          npm run build

      - name: Build Project 02 — Online Thrift Store (Next.js Static Export)
        working-directory: ./thrift-store
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm ci
          rm -rf src/app/api
          npm run build

      - name: Assemble GitHub Pages bundle
        run: |
          mkdir -p _site/coffee-shop _site/thrift-store
          cp -r coffee-shop/dist/* _site/
          cp -r coffee-shop/dist/* _site/coffee-shop/
          cp -r thrift-store/out/* _site/thrift-store/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
